name: igse-ci
on:
  push:
    branches:
      - develop
      - feature/*
  pull_request:
    branches:
      - develop



jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
         java-version: 21
         distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x componentTest -x blackBoxTest

      # - name: Print Hello, World!
      #   run: echo "Build Success"

#      - name: Get ServiceNow Ticket Number
#        id: get_ticket
#        uses: actions/github-script@v7
#        with:
#          script: |
#            // Prompt for ServiceNow ticket number
#            const ticket = await github.actions.prompt('Enter the ServiceNow ticket number:');
#            return ticket;

      - name: Run conditional script
        run: |
          #!/bin/bash
          GIT_REF=$(git rev-parse --abbrev-ref HEAD)
          if [[ $GIT_REF == "develop" || $GIT_REF == hotfix-* ]]; then
            echo "This is a hotfix branch: $GIT_REF"
          else
            echo "This is NOT a hotfix branch: $GIT_REF"
          fi

      - name: Display ServiceNow Ticket Number
        run: echo "The ServiceNow ticket number is ${{ steps.get_ticket.outputs.result }}"
