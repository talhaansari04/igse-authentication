name: igse-ci
on: [push, pull_request]

jobs:
  create-check:
    runs-on: ubuntu-latest
    outputs:
      check_id: ${{ steps.create-check.outputs.check_id }}
    steps:
      - name: Create Pending Check Run
        id: create-check
        uses: actions/github-script@v6
        with:
          script: |
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Ticket Approval',
              head_sha: context.sha,
              status: 'in_progress',
              details_url: 'https://github.com/${{ github.repository }}/commit/${{ github.sha }}/checks',
              output: {
                title: 'Awaiting Ticket Input',
                summary: 'Comment with `/ticket <TICKET_NUMBER>` to approve.'
              }
            });
            core.setOutput('check_id', check.id);

  wait-for-comment:
    runs-on: ubuntu-latest
    needs: [create-check]
    outputs:
      ticket: ${{ steps.parse-comment.outputs.ticket }}
    steps:
      - name: Poll for Approval Comment
        id: poll-comment
        uses: actions/github-script@v6
        env:
          CHECK_ID: ${{ needs.create-check.outputs.check_id }}
        with:
          script: |
            const MAX_ATTEMPTS = 30;  // 30 attempts * 20s = 10min timeout
            const SLEEP_TIME_MS = 20000;

            for (let i = 0; i < MAX_ATTEMPTS; i++) {
              // Use the CORRECT method to fetch commit comments
              const { data: comments } = await github.rest.repos.listCommentsForCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });

              // Find the approval comment
              const approvalComment = comments.find(c => 
                c.body.startsWith('/ticket') && 
                c.user.login !== 'github-actions[bot]'  // Ignore bot comments
              );

              if (approvalComment) {
                const ticket = approvalComment.body.split(' ')[1];
                core.setOutput('ticket', ticket);
            
                // Update check run to "success"
                await github.rest.checks.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  check_run_id: process.env.CHECK_ID,
                  status: 'completed',
                  conclusion: 'success',
                  output: {
                    title: 'Ticket Approved',
                    summary: `Validating ticket: ${ticket}`
                  }
                });
                return;
              }

              // Wait before retrying
              await new Promise(resolve => setTimeout(resolve, SLEEP_TIME_MS));
            }
            core.setFailed('Timeout: No approval comment found.');

      - name: Extract Ticket Number
        id: parse-comment
        run: |
          echo "ticket=${{ steps.poll-comment.outputs.ticket }}" >> $GITHUB_OUTPUT

  validate-ticket:
    needs: [wait-for-comment]
    runs-on: ubuntu-latest
    steps:
      - name: Validate ServiceNow Ticket
        run: |
          echo "Validating ticket: ${{ needs.wait-for-comment.outputs.ticket }}"
          # Add validation logic (e.g., API call to ServiceNow)