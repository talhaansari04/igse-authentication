name: CI

on:
  push:
    branches:
      - 'feature*'

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Deploy App
        id: deploy
        run: |
          echo "Deploying app..."

      - name: Step 2 - Run Integration Tests
        id: integration_test
        if: ${{ steps.deploy.outcome == 'success' }}
        run: |
          echo "Running integration tests..."
          exit 1  # Fail the job for demonstration purposes


      - name: Step 3 - Cleanup
        if: always() && true
        run: |
          echo "Performing cleanup... ${{ steps.deploy.outcome == 'success' }}"
          # Insert your cleanup commands here
          # For example, you might run:
          # kubectl delete pods --all

      - name: Step 4 - Tag the commit
        if: ${{ steps.deploy.outcome == 'success' }} && ${{ steps.integration_test.outcome == 'success' }}
        run: |
          echo "Tagging the commit..."