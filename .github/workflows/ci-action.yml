name: CI

on:
  push:
    branches:
      - 'feature*'

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Deploy App
        id: deploy
        run: |
          echo "Deploying app..."


      - name: Step 2 - Run Integration Tests
        id: integration_test
        if: ${{ steps.deploy.outcome == 'success' }}
        run: |
          echo "Running integration tests..."
          # Insert your integration test commands here
          # For example, you might run:
          # ./run-tests.sh
        continue-on-error: true

      - name: Step 3 - Cleanup
        if: ${{ steps.deploy.outcome == 'success' }}
        run: |
          echo "Performing cleanup..."
          # Insert your cleanup commands here
          # For example, you might run:
          # kubectl delete pods --all
