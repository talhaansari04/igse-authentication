name: CI

on:
  push:
    branches:
      - 'feature*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Environment Setup
        run: |
          echo "Running integration tests..."
  tag:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          fetch-depth: 0  # Ensure full git history (needed for annotated tags)
      - name: Development Tag Creation
        env:
          AUTHOR: ${{ github.event.pusher.name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
            echo "Creating tag for development branch"
            echo "Author: $AUTHOR"
            echo "SHA: $SHA"
            git tag -a "dev-${{ github.run_number }}" -m "Development tag created by $AUTHOR"
            git push origin "dev-${{ github.run_number }}"