name: CD

on:
  push:
    tags:
      - '*'  # Triggers on any tag starting with "v"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensure full git history (needed for annotated tags)

      - name: Extract Tag Name
        id: extract_tag
        run: |
          # GITHUB_REF is like "refs/tags/v1.0.1"
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Tag Name: $TAG_NAME"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Extract Tag Message
        id: extract_message
        run: |
          echo "Tag Message: ${{ github.event.client_payload.message }}"
          TAG=$(git tag -l --format='%(contents:subject)'${GITHUB_REF#refs/*/})
          echo "tag_name = : $TAG"


      - name: Capture Tag Message
        run: |
          # Extract the tag name from GITHUB_REF (e.g. "refs/tags/1.0.0" -> "1.0.0")
          TAG=${GITHUB_REF##*/}
          echo "Detected tag: $TAG"
          
          # Retrieve the full annotated tag message
          TAG_MESSAGE=$(git for-each-ref --format='%(contents)' refs/tags/$TAG)
          echo "Tag message: $TAG_MESSAGE"
          
          # Optionally, set the tag message as an output variable for use in later steps:
          echo "tag_message=$TAG_MESSAGE" >> $GITHUB_OUTPUT
