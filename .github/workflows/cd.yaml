name: CD

on:
  push:
    tags:
      - 'dev.standard.*'
      - 'prod.standard.*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch All Tags
        run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*

      - name: Get Latest Tag Subject
        id: get_tag_subject
        run: |
          TAG_SUBJECT=$(git tag --sort=-creatordate | head -n 1 | xargs -I {} git tag -l --format='%(contents:subject)' {})
          echo "::set-output name=tag_subject::$TAG_SUBJECT"

      - name: Print Latest Tag Subject
        run: |
          echo "Latest tag subject: ${{ steps.get_tag_subject.outputs.tag_subject }}"

      - name: Print Tag Message
        if: startsWith(github.ref, 'ref/tag/dev.standard.') || startsWith(github.ref, 'ref/tag/prod.dev.standard.')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "The latest tag is: $TAG_NAME"
          if [[ "$TAG_NAME" == dev.* ]]; then
            echo "Stage tag pushed"
          elif [[ "$TAG_NAME" == prod.* ]]; then
            echo "Prod tag pushed"
          else
            echo "Unknown tag pushed $TAG_NAME"
          fi