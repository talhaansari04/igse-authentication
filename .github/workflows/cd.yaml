name: CD

on:
  push:
    tags:
      - '*'  # Triggers on any tag starting with "v"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensure full git history (needed for annotated tags)

      - name: Extract Tag Name
        id: extract_tag
        run: |
          # GITHUB_REF is like "refs/tags/v1.0.1"
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Tag Name: $TAG_NAME"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Extract Tag Message
        id: extract_message
        run: |
          # This command fetches the tag message from the annotated tag
          TAG_MESSAGE=$(git for-each-ref --format='%(contents)' refs/tags/${GITHUB_REF#refs/tags/})
          echo "Tag Message: $TAG_MESSAGE"
          TAG=$(git tag -l --format='%(contents:subject)'${GITHUB_REF#refs/*/})
          echo "tag: $TAG"
      - name: Use Tag Information
        run: |
          echo "Processing release for tag: $TAG_NAME"
          echo "Tag message: $TAG_MESSAGE"
