services:
  igse:
    core:
      endpoint: http://localhost:9701
    payment:
      endpoint: http://localhost:9702
  kafka:
    regisTopics: v1.dev.regi
    groupId: "default-dev"

service:
  kafka:
    enable: true
    wallet:
      topic: "wallet.v1"
      groupId: "wallet-dev-A1"
poller:
  outOfBox:
    cron: "0 0/1 * * * ?"
    enable: true
spring:
  jpa:
    show-sql: false
  sql:
    init:
      mode: ALWAYS
      data-locations:
        - classpath:sql/cleanUp.sql
        - classpath:sql/dashboard_admin.sql