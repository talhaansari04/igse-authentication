pluginManagement {
	repositories {
		maven {
			url = uri("https://maven.pkg.github.com/talhaansari04/igse-plugin")
			credentials {
				username = settings.ext.find('gpr.user') ?: System.getenv('GITHUB_USERNAME')
				password = settings.ext.find('gpr.key') ?: System.getenv('GITHUB_TOKEN')
			}
		}
		maven { url 'https://repo.spring.io/milestone' }
		maven { url 'https://repo.spring.io/snapshot' }
		gradlePluginPortal()
		println "Resolved credentials:"
		println "Username: ${settings.ext.find('gpr.user') ?: System.getenv('GITHUB_USERNAME')}"
		println "Using repository: https://maven.pkg.github.com/talhaansari04/igse-plugin"

	}
}

rootProject.name = 'igse-authentication'
def modules = ["performance"]
include(modules as String[])
modules.each { name ->
	project(":${name}").projectDir = "$rootDir/$name/" as File
}
