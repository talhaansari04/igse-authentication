plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'jacoco'
    id 'com.gorylenko.gradle-git-properties' version '2.4.0'
    //id 'org.unbroken-dome.test-sets' version '4.0.0'
    // id 'docker-compose'
}

springBoot {
    buildInfo()
}
group = 'com.igse'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

ext['springCloudVersion'] = '2023.0.1'
ext['spring-framework.version'] = '6.1.13'
ext['tomcat.version'] = '10.1.25'


dependencies {
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    /*implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'*/
    implementation("io.jsonwebtoken:jjwt-api:0.11.5")
    implementation("io.jsonwebtoken:jjwt-impl:0.11.5")
    implementation("io.jsonwebtoken:jjwt-jackson:0.11.5")
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    implementation "org.springframework.boot:spring-boot-starter-aop"
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    testImplementation "com.github.tomakehurst:wiremock-jre8-standalone:2.35.2"
    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.8.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.8.0'
    implementation 'org.flywaydb:flyway-mysql'
    testImplementation 'io.rest-assured:rest-assured:5.3.1'
    testImplementation 'org.hamcrest:hamcrest:2.1'
    implementation 'com.igse:igse-common:1.0'
    //implementation 'com.vladmihalcea:hibernate-types-52:2.21.1'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('bootBuildImage') {
    builder = 'paketobuildpacks/builder-jammy-base:latest'
}


tasks.named('test') {
    group 'igse-test'
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

project.tasks.register('blackBoxTest', Test) {
    group = 'igse-test'
    description = "Run black box test"
    include '**/blackbox/**'
    //systemProperty 'spring.profiles.active', 'test'
    testLogging.showStandardStreams = true
    //useJUnitPlatform()
}

project.tasks.register('componentTest', Test) {
    group 'igse-test'
    include '**/component/**'
    systemProperty 'spring.profiles.active', 'test'
    useJUnitPlatform()
}

project.blackBoxTest.mustRunAfter project.jacocoTestCoverageVerification
project.check.dependsOn project.blackBoxTest

test {
    testLogging {
        events "passed", "skipped", "standardError"
        exceptionFormat = "full"
    }
    useJUnitPlatform()
    //finalizedBy jacocoTestReport
}

bootJar {
    destinationDirectory.set(file("D:\\Project\\buildJars"))
}

bootRun {
    jvmArgs(["-Dspring.output.ansi.enabled=ALWAYS", "-Dspring.profiles.active=dev"])
}
jacocoTestReport {
    reports {
        xml.required = false
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco')
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "com/igse/dto/**",
                    "com/igse/entity/**"
            ])
        }))
    }
}


configurations.runtimeClasspath.resolutionStrategy.activateDependencyLocking()